name: release
# Started by `ic release cli`, which works out the version and changelog.
# Releases run on main and the published release creates the tag, rather than
# starting from a pushed tag, so the prod environment (main only) guarantees
# every release is a commit on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.2.3 or v1.2.3-beta.1"
        type: string
        required: true
      sha:
        description: "Commit ic built the changelog from; the run fails if main has moved since"
        type: string
        required: true
      message:
        description: "Release notes (the changelog)"
        type: string
        required: false

permissions: {}

# One release at a time, so a second run's tag check sees the first run's tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - id: version
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run on main, not $GITHUB_REF"; exit 1
          fi
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $SHA to $GITHUB_SHA since the changelog was built. Run ic release cli again."; exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          # Only a 404 means the tag is free; any other error stops the release.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            echo "::error::$TAG already exists"; exit 1
          elif ! grep -q "HTTP 404" <<<"$out"; then
            echo "::error::Couldn't check whether $TAG exists: $out"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

  draft-release:
    runs-on: ubuntu-24.04
    needs: version
    permissions:
      contents: write
    steps:
      - name: Check for existing release
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      # Publishing the release creates the tag, on the dispatched commit.
      - name: Create draft release
        if: steps.check-release.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
          NOTES: ${{ inputs.message }}
        run: |
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            --draft

      - name: Reset to draft
        if: steps.check-release.outputs.EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
          NOTES: ${{ inputs.message }}
        run: |
          gh release edit "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            --draft

  build-and-release:
    runs-on: ${{ matrix.runner }}
    needs: [version, draft-release]
    environment: prod
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04 }
          - { goos: darwin, goarch: amd64, runner: macos-latest }
          - { goos: darwin, goarch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: windows, goarch: arm64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SUFFIX=""
          if [ "$GOOS" = "windows" ]; then
            SUFFIX=".exe"
          fi
          go build -ldflags "-X github.com/infracost/cli/version.Version=${VERSION}" -o "bin/infracost${SUFFIX}" main.go

      - name: Import signing certificate
        if: matrix.goos == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Sign binary
        if: matrix.goos == 'darwin'
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" bin/infracost
          codesign --verify --strict --verbose=2 bin/infracost

      - name: Notarize binary
        if: matrix.goos == 'darwin'
        env:
          MACOS_NOTARIZATION_API_KEY: ${{ secrets.MACOS_NOTARIZATION_API_KEY }}
          MACOS_NOTARIZATION_API_KEY_ID: ${{ vars.MACOS_NOTARIZATION_API_KEY_ID }}
          MACOS_NOTARIZATION_API_ISSUER_ID: ${{ vars.MACOS_NOTARIZATION_API_ISSUER_ID }}
        run: |
          echo "$MACOS_NOTARIZATION_API_KEY" | base64 --decode > notary-key.p8
          ditto -c -k --keepParent bin/infracost notarize.zip
          xcrun notarytool submit notarize.zip \
            --key notary-key.p8 \
            --key-id "$MACOS_NOTARIZATION_API_KEY_ID" \
            --issuer "$MACOS_NOTARIZATION_API_ISSUER_ID" \
            --wait \
            --timeout 30m
          rm notary-key.p8 notarize.zip

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ARCHIVE="infracost-${GOOS}-${GOARCH}"
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd bin && zip -r "../dist/${ARCHIVE}.zip" "infracost.exe")
            (cd dist && shasum -a 256 "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256")
          else
            tar -czf "dist/${ARCHIVE}.tar.gz" -C bin infracost
            (cd dist && shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256")
          fi

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          gh release upload "$VERSION" ./dist/* \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSET_PUBLICATION_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          BUCKET: ${{ secrets.AWS_ASSET_BUCKET }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: v${{ needs.version.outputs.version }}
          VERSION_NO_V: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GOOS" = "windows" ]; then
            EXT="zip"
            SRC="dist/infracost-${GOOS}-${GOARCH}.zip"
          else
            EXT="tar.gz"
            SRC="dist/infracost-${GOOS}-${GOARCH}.tar.gz"
          fi
          printf "%s\n" "$VERSION_NO_V" > version.txt
          aws s3 cp "$SRC" "s3://${BUCKET}/cli/${GOOS}/${GOARCH}/${VERSION}/data.${EXT}"
          aws s3 cp "$SRC" "s3://${BUCKET}/cli/${GOOS}/${GOARCH}/latest/data.${EXT}"
          aws s3 cp "${SRC}.sha256" "s3://${BUCKET}/cli/${GOOS}/${GOARCH}/${VERSION}/data.${EXT}.sha256"
          aws s3 cp "${SRC}.sha256" "s3://${BUCKET}/cli/${GOOS}/${GOARCH}/latest/data.${EXT}.sha256"
          aws s3 cp version.txt "s3://${BUCKET}/cli/${GOOS}/${GOARCH}/latest/version"

  invalidate-cloudfront:
    runs-on: ubuntu-24.04
    needs: [version, build-and-release]
    environment: prod
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSET_PUBLICATION_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_ASSET_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/cli/*"

  publish-release:
    runs-on: ubuntu-24.04
    needs: [version, build-and-release]
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          # Publishing onto an existing tag would attach these binaries to
          # whatever commit it points at. Only "not found" means it's free.
          if tagged=$(gh api "repos/${{ github.repository }}/commits/$VERSION" --jq .sha 2>"$RUNNER_TEMP/err"); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$VERSION was tagged on $tagged since the release started, not $GITHUB_SHA"; exit 1
            fi
          elif ! grep -qE "HTTP (404|422)" "$RUNNER_TEMP/err"; then
            echo "::error::Couldn't check $VERSION: $(cat "$RUNNER_TEMP/err")"; exit 1
          fi
          gh release edit "$VERSION" \
            --repo "${{ github.repository }}" \
            --draft=false

  trigger-chocolatey:
    if: ${{ !contains(needs.version.outputs.version, '-alpha') && !contains(needs.version.outputs.version, '-beta') }}
    name: Trigger Chocolatey publish
    runs-on: ubuntu-24.04
    needs: [version, publish-release]
    permissions:
      id-token: write
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: app-token
        with:
          domain: sts.infracost.io
          scope: infracost
          identity: cli-release-dispatch

      - name: Dispatch chocolatey build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/infracost/chocolatey-packages/dispatches \
            -f event_type=infracost2_choco

  update-infracost-docs:
    if: ${{ !contains(needs.version.outputs.version, '-alpha') && !contains(needs.version.outputs.version, '-beta') }}
    name: Update Infracost Docs to reference latest CLI version
    runs-on: ubuntu-24.04
    needs: [version, publish-release]
    permissions:
      id-token: write
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: app-token
        with:
          domain: sts.infracost.io
          scope: infracost
          identity: cli-release-dispatch

      - name: Dispatch docs releases.json bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/infracost/docs/dispatches \
            -f event_type=bump_cli_version
